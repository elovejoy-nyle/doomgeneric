name: Build Doom for Pi and IDEC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: idec-hg2j-armhf
            runner: ubuntu-24.04
            image: debian:buster
            arch: armhf
            compiler: arm-linux-gnueabihf-gcc
            compiler_package: gcc-arm-linux-gnueabihf
            ffi: libffi6
          - target: pi-bookworm-arm64
            runner: ubuntu-24.04-arm
            image: debian:bookworm
            arch: arm64
            compiler: gcc
            compiler_package: gcc
            ffi: libffi8
    steps:
      - name: Download the selected upstream source
        run: |
          git init source
          git -C source remote add origin https://github.com/misterk72/doomgeneric.git
          git -C source fetch --depth 1 origin 75fbe8ec2ab8f7b79af5a8d8bb257286863a6325
          git -C source checkout --detach FETCH_HEAD

      - name: Compile against target distribution
        env:
          BUILD_IMAGE: ${{ matrix.image }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_NAME: ${{ matrix.target }}
          TARGET_CC: ${{ matrix.compiler }}
          CC_PACKAGE: ${{ matrix.compiler_package }}
          FFI_PACKAGE: ${{ matrix.ffi }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/source:/src" -w /src \
            -e TARGET_ARCH -e TARGET_NAME -e TARGET_CC -e CC_PACKAGE -e FFI_PACKAGE \
            "$BUILD_IMAGE" sh -eu -c '
              if [ "$TARGET_ARCH" = armhf ]; then
                printf "%s\n" "deb http://archive.debian.org/debian buster main" \
                  > /etc/apt/sources.list
                printf "%s\n" "Acquire::Check-Valid-Until \"false\";" \
                  > /etc/apt/apt.conf.d/99archive
                dpkg --add-architecture armhf
              fi
              apt-get update
              apt-get install -y --no-install-recommends \
                "$CC_PACKAGE" make file binutils \
                "libc6-dev:$TARGET_ARCH" "libwayland-dev:$TARGET_ARCH"
              cd doomgeneric
              make -f Makefile.wayland_shm -j2 \
                CC="$TARGET_CC" \
                CFLAGS="-O2 -fcommon -D_DEFAULT_SOURCE -DDOOMGENERIC_RESX=320 -DDOOMGENERIC_RESY=200" \
                SDL_CFLAGS= SDL_LIBS= LIBS="-lwayland-client -lm"
              mkdir -p "/src/dist/$TARGET_NAME/lib" /src/downloads
              cp doomgeneric "/src/dist/$TARGET_NAME/doomgeneric"
              cd /src/downloads
              apt-get download "libwayland-client0:$TARGET_ARCH" "$FFI_PACKAGE:$TARGET_ARCH"
              for deb in *.deb; do dpkg-deb -x "$deb" extracted; done
              find extracted -type f -name "*.so*" \
                -exec cp -t "/src/dist/$TARGET_NAME/lib" {} +
              find extracted -type l -name "*.so*" \
                -exec cp -P -t "/src/dist/$TARGET_NAME/lib" {} +
              cd /src
              file "dist/$TARGET_NAME/doomgeneric" | tee "dist/$TARGET_NAME/build-info.txt"
              readelf -h "dist/$TARGET_NAME/doomgeneric" >> "dist/$TARGET_NAME/build-info.txt"
              readelf --version-info "dist/$TARGET_NAME/doomgeneric" >> "dist/$TARGET_NAME/build-info.txt"
              readelf -d "dist/$TARGET_NAME/doomgeneric" >> "dist/$TARGET_NAME/build-info.txt"
              cp README.md README.TXT "dist/$TARGET_NAME/"
            '

      - name: Package binary and libraries
        env:
          TARGET_NAME: ${{ matrix.target }}
        run: |
          sudo chown -R "$(id -u):$(id -g)" source/dist
          chmod -R a+rX source/dist
          tar -czf "$TARGET_NAME.tar.gz" -C source/dist "$TARGET_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
